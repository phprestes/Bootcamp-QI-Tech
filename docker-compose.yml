# Valores padrão em ${VAR:-padrão}: o .env é opcional e só sobrescreve.

services:
  api:
    build:
      context: .
      target: api
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      # Host "db" é o nome do serviço; não é configurável.
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-digital-bank-api}
      # Padrão só para desenvolvimento.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      # No compose, o birô é o mock (docs/06-operacao/resiliencia.md).
      BUREAU_API_URL: http://mock:1080/bureau
      BUREAU_API_INTERNAL_TOKEN: ${BUREAU_API_INTERNAL_TOKEN:-default_token}
      BUREAU_API_TIMEOUT: ${BUREAU_API_TIMEOUT:-5}
      TRANSFER_FEE_CENTS: ${TRANSFER_FEE_CENTS:-200}
      MAX_ACCOUNTS_PER_CUSTOMER: ${MAX_ACCOUNTS_PER_CUSTOMER:-3}
    volumes:
      # Código montado + --reload: salvou, recarregou.
      - ./src:/app
    command: uvicorn app:app --host 0.0.0.0 --port 3000 --no-server-header --reload
    healthcheck:
      # pytest e make up --wait dependem deste healthcheck.
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  db:
    build: ./database/.
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock:
    # Sobe vazio; cada teste configura a resposta. Versão fixa.
    image: mockserver/mockserver:mockserver-5.11.1
    command: -logLevel ERROR -serverPort 1080
    ports:
      - "${MOCK_PORT:-1080}:1080"

  pgadmin:
    # Só para inspecionar o banco no navegador; a API e os testes não dependem dele. Versão fixa.
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@bootcamp.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-bootcamp}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy

